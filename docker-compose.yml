version: '3.8'

services:
  main-automation:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: main-automation
    restart: unless-stopped
    hostname: main-automation
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tools:/opt/automation-tools
      - ./casc_configs:/var/jenkins_home/casc_configs
    environment:
      - JAVA_OPTS=-Xmx2048m -Djenkins.install.runSetupWizard=false
      - JENKINS_OPTS=--prefix=/jenkins
      - JENKINS_SLAVE_AGENT_PORT=50000
    networks:
      - main-network

volumes:
  jenkins_home:
    driver: local
    name: jenkins_home_volume

networks:
  main-network:
    driver: bridge
    name: main-network